name: Bug
description: Algo não funcionou como deveria no jogo.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Valeu por ajudar a melhorar o Mode 7 City! Quanto mais detalhe, mais rápido sai a correção.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Conte o que deu errado.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como repetir
      description: O passo a passo até o bug aparecer, se você souber.
      placeholder: |
        1. Comecei uma cidade nova no mapa 007
        2. Construí uma usina
        3. ...
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava?
  - type: dropdown
    id: versao
    attributes:
      label: Versão do jogo
      options:
        - v1.0.0
        - Outra (diga na descrição)
    validations:
      required: true
  - type: dropdown
    id: controle
    attributes:
      label: Jogando com
      multiple: true
      options:
        - Controle
        - Teclado
        - Mouse
  - type: input
    id: sistema
    attributes:
      label: Sistema
      placeholder: Windows 11
  - type: textarea
    id: anexos
    attributes:
      label: Prints, vídeo ou save
      description: Arraste aqui. Se o bug for numa cidade salva, mandar o save ajuda muito.
